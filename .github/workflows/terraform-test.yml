name: terraform-test

# Native `terraform test` (plan-only, mocked providers). No Azure / Cloudflare
# / GitHub credentials — the suite in tests/*.tftest.hcl stubs child modules
# and never applies. Safe to run on pull_request in this public repository.

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tftest.hcl"
      - ".terraform.lock.hcl"
      - "tests/**"
      - ".github/workflows/terraform-test.yml"
  workflow_dispatch:
    inputs:
      working-directory:
        description: "Directory to run terraform test in"
        type: string
        default: "."
  workflow_call:
    inputs:
      terraform-version:
        description: Terraform version (keep in sync with terraform-pipeline.yml)
        type: string
        required: false
        default: "1.15.3"
      working-directory:
        description: Working directory for init/test
        type: string
        required: false
        default: "."

permissions:
  contents: read

concurrency:
  group: terraform-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: ${{ inputs.terraform-version || '1.15.3' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  test:
    name: Terraform unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || '.' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Prepare plugin cache directory
        run: mkdir -p "$HOME/.terraform.d/plugin-cache"

      - name: Cache Terraform plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tfplugins-${{ env.TF_VERSION }}-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-tfplugins-${{ env.TF_VERSION }}-
            ${{ runner.os }}-tfplugins-

      - name: Configure plugin cache
        run: echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"

      - name: Terraform init
        run: |
          set -euo pipefail
          echo "::group::terraform init"
          terraform init -backend=false
          echo "::endgroup::"

      - name: Terraform test
        run: |
          set -euo pipefail
          echo "::group::terraform test"
          terraform test
          echo "::endgroup::"
          echo "::notice title=Terraform test::All native unit tests passed"

      - name: Write test summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Terraform unit tests"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Terraform | \`${TF_VERSION}\` |"
            echo "| Result | ${JOB_STATUS} |"
            echo ""
            echo "Plan-only \`terraform test\` with mocked providers. No cloud credentials."
          } >> "$GITHUB_STEP_SUMMARY"
