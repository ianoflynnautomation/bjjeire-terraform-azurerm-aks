name: terraform-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      working_directory:
        description: "Directory to run quality checks in"
        type: string
        default: "."

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    permissions:
      contents: read
      pull-requests: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/terraform-quality.yml@v1
    with:
      working-directory: ${{ inputs.working_directory || '.' }}
      terraform-version: "1.15.3"
      tflint-version: "v0.53.0"
      tflint-var-file: environments/dev/example.tfvars
      tflint-module-paths: "modules/*/"
      comment-title: Terraform Quality Checks
